name: Build Executables
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: YATG.exe
            asset: YATG-windows.zip
          - os: ubuntu-latest
            output: YATG
            asset: YATG-linux.zip
          - os: macos-latest
            output: YATG
            asset: YATG-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nuitka Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('**/*.py') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: install dependencies
        run: pip install -r requirements.txt nuitka

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka --standalone --onefile `
            --enable-plugin=pyside6 `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --include-data-dir=assets=assets `
            --include-data-dir=startup=startup `
            --include-data-dir=configs=configs `
            --include-data-dir=fonts=fonts `
            --include-data-dir=ui/icons=ui/icons `
            --include-package=PIL `
            --output-filename=YATG.exe `
            main.py

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m nuitka --standalone --onefile \
            --enable-plugin=pyside6 \
            --assume-yes-for-downloads \
            --include-data-dir=assets=assets \
            --include-data-dir=startup=startup \
            --include-data-dir=configs=configs \
            --include-data-dir=fonts=fonts \
            --include-data-dir=ui/icons=ui/icons \
            --include-qt-plugins=all \
            --include-package=PIL \
            --output-filename=YATG \
            main.py

      - name: upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            YATG.exe
            LICENSE

      - name: upload (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            YATG
            LICENSE